<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>一抹花顏｜二手旗袍專賣 S-5XL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'jf-openhuninn';
      src: url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.0.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg-dark: #0f0e13;
      --gold-light: #f6e29c;
      --gold-main: #dfb76c;
      --gold-dark: #a67c37;
      --red-seal: #b83b3b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'jf-openhuninn', 'Zen Maru Gothic', sans-serif;
      background-color: var(--bg-dark);
      color: #f7f3e9;
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(223, 183, 108, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(223, 183, 108, 0.06) 0%, transparent 50%);
      overflow-x: hidden;
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #fff3c4 0%, #dfb76c 50%, #c19346 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-card {
      background: linear-gradient(180deg, #1b1822 0%, #121017 100%);
      border: 1.5px solid rgba(223, 183, 108, 0.38);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }
    .gold-btn {
      background: linear-gradient(135deg, #f3d48b 0%, #d4a656 100%);
      color: #1a140b;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(223, 183, 108, 0.3);
      transition: all 0.2s ease;
    }
    .gold-btn:active { transform: scale(0.97); }
    .seal-badge {
      background-color: var(--red-seal);
      border: 1px solid #f3d48b;
      color: #fff8ea;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      user-select: none;
      cursor: pointer;
    }
    .size-pill {
      transition: all 0.2s ease;
      border: 1.5px solid rgba(223, 183, 108, 0.4);
      background: rgba(27, 24, 34, 0.9);
    }
    .size-pill.active {
      background: linear-gradient(135deg, #f3d48b 0%, #d4a656 100%);
      color: #1a140b;
      border-color: #fff3c4;
      font-weight: 900;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-28">

  <!-- 輕量提示訊息膠囊 -->
  <div id="toastBanner" class="fixed top-4 left-1/2 -translate-x-1/2 z-[120] hidden px-4 py-2.5 rounded-full bg-[#1b1822]/95 border-2 border-[#dfb76c] text-[#f6e29c] text-xs font-bold shadow-2xl transition-all duration-300 whitespace-nowrap">
    ✨ 提示訊息
  </div>

  <!-- 🔓 店長管理後台工具列 (預設隱藏，輸入密碼後才顯示) -->
  <div id="adminToolbar" class="hidden sticky top-0 z-50 bg-[#172620] border-b-2 border-[#dfb76c] px-3 py-2.5 shadow-xl">
    <div class="max-w-xl mx-auto space-y-2">
      <div class="flex flex-wrap items-center justify-between gap-1">
        <span class="text-xs font-bold text-[#6ee7b7]">🔓 店長管理後台已解鎖</span>
        <div class="flex items-center gap-1">
          <button onclick="logoutAdmin()" class="px-2 py-1 rounded-full text-[11px] bg-rose-700 text-white font-bold">🔒 登出</button>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-1.5 text-xs">
        <button onclick="triggerAvatarUpload()" class="py-1.5 rounded-xl bg-[#241f2e] text-[#f6e29c] border border-[#dfb76c]/40 font-bold">📷 換品牌頭像</button>
        <button onclick="openEditModal(-1)" class="py-1.5 rounded-xl gold-btn font-bold">➕ 新增上架旗袍</button>
      </div>
      <div class="grid grid-cols-2 gap-1.5">
        <button onclick="exportUpdatedHtmlFile()" class="py-2 rounded-xl bg-gradient-to-r from-[#1e3a8a] to-[#1d4ed8] text-white border border-[#93c5fd]/60 text-[11px] font-bold shadow-md flex items-center justify-center gap-1">
          <span>💾 下載 index.html</span>
        </button>
        <button onclick="copyFullHtmlCode()" class="py-2 rounded-xl bg-emerald-700 text-white border border-emerald-300/50 text-[11px] font-bold shadow-md flex items-center justify-center gap-1">
          <span>📋 複製完整程式碼</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 頂部公告條 -->
  <div class="bg-[#14111a] border-b border-[#dfb76c]/25 px-3 py-2 text-center">
    <p class="text-xs text-[#f3d48b] font-medium">
      ✨ 全館九成新以上・僅穿過 1～2 次以內 ✨
    </p>
    <div class="flex flex-wrap justify-center gap-1.5 mt-1">
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] bg-[#241f2e] text-[#f6e29c] border border-[#dfb76c]/30">
        🫧 皆已
